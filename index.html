<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGStorex İlanlar</title>
<style>
:root{
  --bg:#09090d;
  --card:#111119;
  --card2:#161620;
  --line:#262635;
  --text:#ffffff;
  --muted:#a7a7b8;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% -10%, rgba(139,92,246,.16), transparent 35%),
    radial-gradient(circle at 90% 10%, rgba(91,33,182,.12), transparent 30%),
    var(--bg);
}
.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:52px 0 70px;
}
.top{
  margin-bottom:30px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.logo{
  width:42px;height:42px;
  border-radius:13px;
  display:grid;place-items:center;
  font-weight:900;
  background:linear-gradient(135deg,var(--accent),#5b21b6);
  box-shadow:0 10px 30px rgba(139,92,246,.24);
}
h1{
  margin:0;
  font-size:clamp(28px,4vw,42px);
  letter-spacing:-.8px;
}
.subtitle{
  margin:0;
  color:var(--muted);
  font-size:15px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.card{
  display:block;
  color:inherit;
  text-decoration:none;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-4px);
  border-color:#4a376b;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.thumb{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
  background:#181824;
}
.body{padding:17px}
.category{
  display:inline-block;
  margin-bottom:9px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
  color:#ccb8ff;
  background:rgba(139,92,246,.11);
  border:1px solid rgba(139,92,246,.26);
  padding:6px 8px;
  border-radius:999px;
}
.title{
  margin:0 0 8px;
  font-size:18px;
  line-height:1.3;
}
.desc{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  min-height:39px;
}
.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #232331;
}
.price{
  font-size:21px;
  font-weight:900;
  color:var(--accent2);
}
.go{
  font-size:12px;
  color:#d7ccf6;
}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .wrap{width:min(100% - 22px,1180px);padding-top:28px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">OG</div>
      <div>
        <h1>OGStorex İlanlar</h1>
        <p class="subtitle">İlana tıklayınca İtemSatış sayfasına yönlendirilirsin.</p>
      </div>
    </div>
  </div>

  <div class="grid" id="ilanlar"></div>
</div>

<script>
/*
  SADECE BURAYI DÜZENLE.
  Her ilan için:
  baslik = İlan adı
  fiyat = Fiyat
  kategori = Kategori
  aciklama = Kısa açıklama
  resim = Görsel linki
  link = İtemSatış ilan linki
*/
const ilanlar = [
  {
    baslik: "14x Discord Boost",
    fiyat: "199 TL",
    kategori: "Discord",
    aciklama: "1 aylık 14x boost paketi.",
    resim: "https://placehold.co/900x560/171722/a78bfa?text=14x+BOOST",
    link: "https://www.itemsatis.com/"
  },
  {
    baslik: "500 Online Üye",
    fiyat: "149 TL",
    kategori: "Discord",
    aciklama: "500 online üye ilanı.",
    resim: "https://placehold.co/900x560/171722/a78bfa?text=500+ONLINE",
    link: "https://www.itemsatis.com/"
  },
  {
    baslik: "1000 Offline Üye",
    fiyat: "99 TL",
    kategori: "Discord",
    aciklama: "1000 offline üye ilanı.",
    resim: "https://placehold.co/900x560/171722/a78bfa?text=1000+OFFLINE",
    link: "https://www.itemsatis.com/"
  }
];

const alan = document.getElementById("ilanlar");

alan.innerHTML = ilanlar.map(ilan => `
  <a class="card" href="${ilan.link}" target="_blank" rel="noopener noreferrer">
    <img class="thumb" src="${ilan.resim}" alt="${ilan.baslik}">
    <div class="body">
      <span class="category">${ilan.kategori}</span>
      <h2 class="title">${ilan.baslik}</h2>
      <p class="desc">${ilan.aciklama}</p>
      <div class="bottom">
        <div class="price">${ilan.fiyat}</div>
        <div class="go">İlana git →</div>
      </div>
    </div>
  </a>
`).join("");
</script>
</body>
</html>
